<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>practicemeter banner</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="banner.css">
</head>
<body>
<main class="sheet">
  <div class="top">
    <header class="head">
      <img class="icon" src="icon.png" width="104" height="104" alt="">
      <div>
        <h1>practicemeter</h1>
        <p class="sub">A practice timer for musicians. It listens through the microphone and counts only the time your instrument sounds.</p>
      </div>
    </header>

    <section class="instrument" aria-label="The app while you play">
      <p class="status"><span class="lamp" data-state="live"></span> Playing</p>
      <p class="clock">00:24:18</p>
      <div class="meter"><div class="fill"></div><div class="tick"></div></div>
    </section>
  </div>

  <section class="readings">
    <div class="cell">
      <p class="reading">150<small>ms</small></p>
      <p class="tag">Shortest sound that counts</p>
    </div>
    <div class="cell">
      <p class="reading">3<small>s</small></p>
      <p class="tag">Gap that still counts, 1 to 10</p>
    </div>
    <div class="cell">
      <p class="reading">6–24<small>dB</small></p>
      <p class="tag">Above the room, set by sensitivity</p>
    </div>
    <div class="cell">
      <p class="reading">0<small>bytes</small></p>
      <p class="tag">Audio recorded or uploaded</p>
    </div>
  </section>
</main>
</body>
</html>
