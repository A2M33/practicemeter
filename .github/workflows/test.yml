name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check detector.js && node --check micwatch.js && node --check history.js && node --check app.js
      - name: Detector tests
        run: node tests/detector.test.mjs
      - name: Mic watch tests
        run: node tests/micwatch.test.mjs
      - name: History tests
        run: node tests/history.test.mjs
